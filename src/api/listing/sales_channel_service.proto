syntax = "proto3";
package listing_api;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/hdtradeservices/api-proto/go/api/listing";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info : {title : "Sales Channel Webhooks API";
version : "v2";
}
}
;

// SalesChannelService is the set of callbacks a sales channel integration serves on
// its own host, for Zentail to call.
//
// Authentication: Zentail signs every call it makes to a partner host with
// HMAC-SHA256, keyed with the application's callback signing secret. Zentail does
// not call these endpoints yet; once it does, every call carries two headers:
//
//   - X-Zentail-Timestamp: the Unix time in seconds when Zentail signed the call.
//   - X-Zentail-Signature: v1=<lowercase hex HMAC-SHA256 of the signing string>.
//     While a secret is being rotated it holds one comma-separated v1= value per
//     active secret, and a call is genuine if any one of them matches.
//
// The signing string is four parts joined by a single "\n": the timestamp header
// value, the HTTP method in upper case, the request path and query exactly as sent,
// and the raw request body. GET and DELETE send an empty body, so their signing
// string ends in "\n". The method and path are signed because two of the three
// callbacks carry the storefront only in the path.
//
// A partner rejects a call whose signature does not match, or whose timestamp is
// more than 300 seconds from its own clock, with HTTP 401 and a google.rpc.Status
// of code 16 (UNAUTHENTICATED). The full guide:
// https://developer.zentail.com/sales-channel-integration/callbacks/
service SalesChannelService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    name : "Sales Channel Webhooks Service",
    description : "Callbacks a sales channel integration serves on its own host, for Zentail to call. Once Zentail starts calling them, it signs every call with HMAC-SHA256 in the X-Zentail-Timestamp and X-Zentail-Signature headers; see https://developer.zentail.com/sales-channel-integration/callbacks/ for how to verify them."
  };

  rpc InitiateIngestion(InitiateIngestionRequest) returns (InitiateIngestionResponse) {
    option (google.api.http) = {
      post : "/ingestion/initiate"
      body : "*"
    };
  }

  // StorefrontStatus returns the current status of a storefront
  // as a series of diagnostic checks
  rpc StorefrontStatus(StorefrontStatusRequest)
      returns (StorefrontStatusResponse) {
    option (google.api.http) = {
      get : "/v2/storefront/status/{storefront_id}"
    };
  }

  // DeleteConfiguration tells the sales channel to delete (deactivate) the
  // storefront's integration configuration, e.g. when the storefront is
  // disconnected in Zentail.
  rpc DeleteConfiguration(DeleteConfigurationRequest)
      returns (DeleteConfigurationResponse) {
    option (google.api.http) = {
      delete : "/v2/storefront/configuration/{storefront_id}"
    };
  }
}

// InitiateIngestionRequest is the request for the InitiateIngestion RPC
message InitiateIngestionRequest {
    string storefront_id = 1;
    repeated string skus = 2;
    bool auto_apply_ingestion_plan = 3;
}

// InitiateIngestionResponse is the response for the InitiateIngestion RPC
message InitiateIngestionResponse {
}

// StorefrontStatusRequest is the request for the StorefrontStatus RPC
message StorefrontStatusRequest {
  string storefront_id = 1;
}

// DeleteConfigurationRequest is the request for the DeleteConfiguration RPC
message DeleteConfigurationRequest {
  string storefront_id = 1;
}

// DeleteConfigurationResponse is the response for the DeleteConfiguration RPC
message DeleteConfigurationResponse {
}

// StorefrontStatusResponse contains the results of all diagnostic checks
message StorefrontStatusResponse {
  // CheckState represents the result state of a diagnostic check
  enum CheckState {
    CHECK_STATE_UNSPECIFIED = 0;
    CHECK_STATE_PASS = 1;
    CHECK_STATE_FAIL = 2;
    CHECK_STATE_WARNING = 3;
  }
  message Check {
    string name = 1;
    CheckState state = 2;
    string state_short_description = 3;
    string details = 4;
  }
  repeated Check checks = 1;
}
